[workspace]
resolver = "2"
# Listed explicitly rather than `crates/*` so that a half-created crate
# directory cannot break the workspace for everything else while it is being
# written. Grows as each crate lands.
members = ["crates/pecu-protocol", "crates/pecu-chain", "crates/pecu-mock", "crates/pecu-ui", "crates/pecu-app", "crates/pecu-core", "crates/pecu-keystore", "crates/pecu-store", "crates/pecu-chart"]

[workspace.package]
version = "0.1.0"
edition = "2021"
# The SDK sets rust-version = "1.95" and this machine has exactly 1.95.0 with no
# rustup. There is no headroom: raising this, or letting the SDK raise its own,
# breaks the build with no quick way to install another toolchain.
rust-version = "1.95"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
# ── The SDK. Source of truth for keys, addresses, transactions, fees and RPC. ──
#
# Pinned by rev, matching what `verus-pecu-cli` and the web wallet do. The crate
# is not on crates.io, so "latest main" is not a reproducible dependency — and
# the SDK sets rust-version = 1.95 against a machine that has exactly 1.95.0, so
# an upstream MSRV bump must be a deliberate act here rather than a build that
# breaks on a Tuesday. `SDK_REV` in pecu-protocol surfaces this in About.
# `light` is `network` + `shielded` + the lightwalletd client: seeing shielded
# funds. `prover` is what builds a shielded transaction — t→z, z→z and z→t
# alike, because a Sapling *output* needs a Groth16 proof just as a spend does,
# so having a transparent balance does not avoid it.
#
# `prover` costs bellman at compile time and ~50 MB of Sapling parameters at
# run time. Those parameters are the stock Zcash ceremony files, byte for byte —
# the same ones a `verusd` install already has — which is why `pecu_core::params`
# looks where the node put them before it offers to download anything.
#
# `multicore` is bellman's rayon backend. It is a large speedup on a desktop and
# is unavailable only on wasm32, which this does not target.
#
# `serde` is what lets a `ScanResult` be written down. The SDK's own
# documentation asks for it — "**Persist this.** A scan is expensive and its
# result cannot be recovered from a UTXO set" — and the notes and the observed
# nullifiers round-trip together, which is the pair that is wrong in the
# dangerous direction if they are stored apart.
verus-sdk = { git = "https://github.com/chainvue/verus-rust-sdk", rev = "a08d652ddb0837efafa2b5df251ca8d6c28206ae", features = ["network", "light", "prover", "multicore", "serde"] }
# Taken directly (not through the facade) by pecu-mock, which needs
# `verus-rpc` WITHOUT the `http` feature so no socket-capable code exists in its
# dependency graph at all. See pecu-mock/Cargo.toml.
verus-rpc = { git = "https://github.com/chainvue/verus-rust-sdk", rev = "a08d652ddb0837efafa2b5df251ca8d6c28206ae", default-features = false }
# Dev-dependency only, for `testing::ScriptedReader` — which lets a send be
# built and signed against a scripted chain, with the broadcasts it received
# available to assert on. The facade does not forward the `testing` feature, so
# this is taken directly, and pinned to the SAME revision: a different one would
# be testing a different SDK than the one that ships.
verus-flows = { git = "https://github.com/chainvue/verus-rust-sdk", rev = "a08d652ddb0837efafa2b5df251ca8d6c28206ae", features = ["testing"] }

# ── Shared across member crates so versions cannot drift apart. ──
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
zeroize = { version = "1", features = ["derive"] }
tokio = { version = "1", default-features = false }
tokio-util = "0.7"
tracing = "0.1"
hex = "0.4"

# ── The native gRPC transport (pecu-chain/src/grpc.rs). ──
#
# The SDK's `GrpcWebTransport` speaks grpc-web over HTTP/1.1, which no
# lightwalletd speaks without a proxy in front of it. These four crates are what
# it takes to speak the protocol lightwalletd actually serves, so that a wallet
# can be pointed at the canonical Verus endpoint — or at a lightwalletd on
# loopback — with nothing in between.
#
# Nothing here is a new ecosystem. `rustls` and `webpki-roots` already compile
# in this tree (ureq's TLS, and the same trust anchors), `tokio` is already the
# app's runtime, and `bytes`, `slab`, `fnv`, `indexmap`, `futures-*` and
# `tracing` are all present. What is genuinely new is `h2` — the hyper
# project's HTTP/2 implementation — plus `http`, `tokio-util` and the
# `tokio-rustls` adapter, and the sockets `tokio/net` pulls in.
#
# `h2` rather than `hyper` or `tonic`: a gRPC status arrives in HTTP/2
# *trailers*, and h2 hands those over directly. `tonic` would bring prost and a
# protobuf build step to re-derive message types this workspace already has
# through the SDK.
h2 = "0.4"
http = "1"
# Pinned to the same major as the `rustls` ureq already builds, with the same
# provider (`ring`), so one TLS implementation is compiled rather than two.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
# The Mozilla root program, which is what ureq is already verifying against in
# this build. Sharing it means an endpoint that works for the RPC node works
# here, rather than two different notions of who is trusted.
webpki-roots = "0.26"
rustls-pki-types = "1"
bytes = "1"

[workspace.lints.rust]
# Mirrors the SDK: a wallet has no business writing unsafe.
unsafe_code = "forbid"

# The standard here is: every module and every type carries documentation
# explaining what it is FOR and why it is shaped the way it is, and a field is
# documented when it carries information its name does not.
#
# `missing_docs` cannot express that — it is per-item, so enforcing it produces
# `/// The name.` on `pub name: String` a hundred times over. That is not
# documentation, it is the appearance of documentation, and it makes the fields
# that genuinely needed a comment (see `BalanceVm`, `Funding`'s four buckets,
# `PendingVm`) harder to spot rather than easier. The SDK makes the same call
# for `missing_errors_doc` and for the same stated reason.
missing_docs = "allow"

[workspace.lints.clippy]
# Money and consensus bytes: an unchecked conversion here is a fund-loss bug,
# not a style problem. Same three the SDK denies, for the same reason.
cast_possible_truncation = "deny"
cast_sign_loss = "deny"
cast_possible_wrap = "deny"

# Panicking in a wallet is a lost session at best. These are denied in library
# crates; test code is exempt via `#[cfg(test)]` allow attributes where needed.
unwrap_used = "deny"
expect_used = "warn"
panic = "deny"

pedantic = { level = "warn", priority = -1 }
# Prose in doc comments should read as prose. Same call the SDK makes.
doc_markdown = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"
module_name_repetitions = "allow"

[profile.release]
strip = true
lto = "thin"
