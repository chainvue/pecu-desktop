[package]
name = "chainvue-protocol"
description = "The contract between the UI and the wallet core. No SDK, no crypto, no I/O."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

# This dependency list is load-bearing and must stay this short.
#
# `chainvue-ui` depends on this crate and on `slint`, and on nothing else that
# could carry key material. Because nothing here pulls `verus-sdk`, the UI
# cannot NAME `PrivateKey` — not "is discouraged from", cannot. Adding
# `verus-sdk` (or anything re-exporting it) here would silently dissolve that
# boundary, which is why `chainvue-ui/tests/dependency_boundary.rs` asserts it.
[dependencies]
serde = { workspace = true }
thiserror = { workspace = true }
zeroize = { workspace = true }
