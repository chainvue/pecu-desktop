[package]
name = "pecu-chain"
description = "Talking to a Verus node: the client, node health, and the permit that gates spending."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = []
# Swaps a `MockChain` variant into `Chain`. Off in release builds, so the
# variant does not exist in a shipped binary at all.
mock = ["dep:pecu-mock"]

[dependencies]
pecu-protocol = { path = "../pecu-protocol" }
pecu-mock = { path = "../pecu-mock", optional = true }
verus-sdk = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

# The native gRPC transport. See the workspace manifest for why each of these
# is here; `tokio` takes only what one blocking request/response client needs —
# a current-thread reactor, sockets, and a timeout.
h2 = { workspace = true }
http = { workspace = true }
bytes = { workspace = true }
tokio = { workspace = true, features = ["rt", "net", "io-util", "time"] }
tokio-rustls = { workspace = true }
rustls = { workspace = true }
rustls-pki-types = { workspace = true }
webpki-roots = { workspace = true }

[dev-dependencies]
# `testing::ScriptedReader`, for the corroborator's unit tests: two scripted
# nodes with different UTXO sets is the whole of what those tests need, and the
# facade does not forward the `testing` feature. Pinned to the same revision as
# every other SDK crate here — a different one would be testing a different SDK
# than the one that ships. Already a dev-dependency of pecu-core, so this adds
# nothing to the dependency graph.
verus-flows = { workspace = true }
