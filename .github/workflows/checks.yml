# Clippy and the test suite, on every push.
#
# Both call `scripts/check.sh` rather than listing the commands here, so that
# what CI runs and what you can run on your own machine are the same thing by
# construction rather than by somebody remembering to update both.
#
# On `push` for every branch, and deliberately not on `pull_request` as well: a
# pull request from a branch of this repository would then run everything
# twice. Add a `pull_request:` trigger the day an outside fork opens one, which
# is the case a push trigger does not cover.
name: checks

on: push

# A second push supersedes the first. There is no reason to keep a run alive
# for a commit nobody is looking at any more.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # One job per half, on its own machine.
  #
  # The first two attempts both died compiling pecu-ui, which is the large
  # generated Slint crate: once with "No space left on device", once four
  # minutes into a silent compile with SIGTERM and an `if: always()` step
  # skipped, which is a runner going down rather than a command failing.
  # Clippy and rustc share no artefacts, so doing both on one four-core,
  # sixteen-gigabyte runner asks it to hold two complete sets — forty
  # gigabytes on the machine this was developed on. Split, each machine holds
  # one.
  checks:
    strategy:
      fail-fast: false
      matrix:
        half: [clippy, test]

    runs-on: ubuntu-latest

    env:
      CARGO_TERM_COLOR: always
      # Debug information is the bulk of `target`, and `line-tables-only`
      # keeps the file and line in a backtrace, which is the part worth having
      # when a test fails. Incremental artefacts are waste on a machine that
      # compiles each crate exactly once — eighteen of those forty gigabytes.
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
      # Four parallel rustc processes against sixteen gigabytes is what the
      # silent four-minute compile looked like. Two is slower and finishes.
      CARGO_BUILD_JOBS: 2

    steps:
      - uses: actions/checkout@v4

      # The image ships toolchains this repository has no use for, and they
      # cost more disk than the whole build needs. Swap is headroom for the
      # one crate that spikes: slower than memory, and far better than a
      # runner that disappears mid-compile.
      - name: Headroom
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
                      /usr/local/share/boost /usr/local/.ghcup
          sudo fallocate -l 8G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          df -h /
          free -h

      # What the build asks pkg-config for, and the compiler SQLite is built
      # with — `rusqlite` compiles it from source rather than linking, which is
      # why there is no libsqlite3-dev here. The X11, Wayland and GL libraries
      # are not named because nothing links them: the interface tests render
      # offscreen and never open a window.
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libfontconfig-dev

      # The runner image ships a toolchain, but which one is not this
      # repository's decision to inherit. `rustup` is already there, so this
      # needs no third-party action.
      - name: Toolchain
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustc --version
          cargo --version

      # Keyed on Cargo.lock, which pins the SDK by revision — so the key moves
      # exactly when the dependency graph does. Separate per half, because the
      # two hold different artefacts and would otherwise overwrite each other.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-${{ matrix.half }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-${{ matrix.half }}-

      # The sampler prints memory and disk every thirty seconds *into this
      # step*, because a runner that goes down takes every `if: always()` step
      # with it — as the second attempt showed. If this dies again, the last
      # line before the silence says which of the two ran out.
      - name: Checks
        run: |
          ( while sleep 30; do
              printf '· %s  mem %sG used, %sG avail (+%sG swap used)  disk %s free  target %s\n' \
                "$(date -u +%H:%M:%S)" \
                "$(free -g | awk '/^Mem:/{print $3}')" \
                "$(free -g | awk '/^Mem:/{print $7}')" \
                "$(free -g | awk '/^Swap:/{print $3}')" \
                "$(df -h --output=avail / | tail -1 | tr -d ' ')" \
                "$(du -sh target 2>/dev/null | cut -f1)"
            done ) &
          sampler=$!
          trap 'kill "$sampler" 2>/dev/null || true' EXIT
          scripts/check.sh ${{ matrix.half }}

      - name: Headroom left
        if: always()
        run: |
          df -h /
          free -h
          du -sh target 2>/dev/null || true

      # A failed visual test writes a diff image beside every reference it did
      # not match. Without these the log says which screens changed but not
      # what they now look like, which is the half that decides whether the
      # change was wanted.
      - name: Snapshot diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-diffs-${{ matrix.half }}
          path: crates/pecu-ui/tests/snapshots/*.diff.png
          if-no-files-found: ignore
